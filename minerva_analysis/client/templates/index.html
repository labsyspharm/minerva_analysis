{% extends 'base.html' %}

{% block style %}
<link rel="stylesheet" href="../client/src/css/viewer.css">
<link rel="stylesheet" href="../client/src/css/gating.css">
{% endblock %}

{% block content %}

{% if data.datasource %}
<div id="container" class="container">
    <div id="bodyDiv" class="viewer-shell">
        <aside id="viewer_sidebar" class="viewer-sidebar">
            <div class="sidebar-header">
                <div>
                    <span class="sidebar-kicker">Minerva</span>
                    <h1>Viewer</h1>
                </div>
                <button id="sidebar_collapse_button" class="icon-button" title="Collapse controls" type="button">
                    <span class="fas fa-chevron-left"></span>
                </button>
            </div>

            <section class="sidebar-section" id="gate_marker_section">
                <div class="section-heading">
                    <h2>Gate Marker</h2>
                    <div class="section-actions">
                        <button id="gating_upload_icon_db" class="icon-button" title="Load gating from database" type="button">
                            <span class="fas fa-upload"></span>
                        </button>
                        <button id="gating_download_icon_db" class="icon-button" title="Save gating to database" type="button">
                            <span class="fas fa-download"></span>
                        </button>
                        <button id="gating_upload_icon" class="icon-button" title="Load gating from CSV" type="button">
                            <span class="fas fa-file-upload"></span>
                        </button>
                        <button id="gating_download_icon" class="icon-button" title="Download gating CSV" type="button">
                            <span class="fas fa-file-download"></span>
                        </button>
                    </div>
                </div>
                <div id="gating_download_panel">
                    <a id="gating_exit">&#10006;</a>
                    <label>Download gated channel ranges:
                        <span class="download_flex">
                            <input id="download_input1" type="text" autocomplete="false" spellcheck="false"
                                   value="{{ data.datasource }}_gated_channel_ranges.csv">
                            <a id="download_gated_channel_ranges" class="download_button">&#8679;</a>
                        </span>
                    </label>
                    <label>Download gated cell encodings:
                        <span class="download_flex">
                            <input id="download_input2" type="text" autocomplete="false" spellcheck="false"
                                   value="{{ data.datasource }}_gated_cell_encodings.csv">
                            <a id="download_gated_cell_encodings" class="download_button">&#8679;</a>
                        </span>
                    </label>
                    <label>Cell Encoding:
                        <select id="encoding">
                            <option value="binary" selected>Binary Values</option>
                            <option value="intensity">Intensity Values</option>
                        </select>
                    </label>
                </div>
                <form id="arrow-upload-form">
                    <input id="gating-upload-from-arrow" class="hidden" type="file">
                    <input type="hidden" id="upload-arrow-datasource" name="upload-arrow-datasource">
                </form>
                <label class="control-label" for="gate_marker_select">Marker</label>
                <select id="gate_marker_select" class="sidebar-select"></select>
                <div class="range-readout">
                    <span id="gate_min_value">0.00</span>
                    <span id="gate_max_value">0.00</span>
                </div>
                <div id="gate_slider" class="sidebar-slider"></div>
                <button id="gate_auto_button" class="sidebar-action" type="button">Auto</button>
                <div id="gate_distribution_plot" class="distribution-plot"></div>
            </section>

            <section class="sidebar-section" id="image_channel_section">
                <div class="section-heading">
                    <h2>Image Channels</h2>
                    <div class="section-actions">
                        <button id="channels_upload_icon_db" class="icon-button" title="Load channels from database" type="button">
                            <span class="fas fa-upload"></span>
                        </button>
                        <button id="channels_download_icon_db" class="icon-button" title="Save channels to database" type="button">
                            <span class="fas fa-download"></span>
                        </button>
                        <button id="channels_upload_icon" class="icon-button" title="Load channels from CSV" type="button">
                            <span class="fas fa-file-upload"></span>
                        </button>
                        <button id="channels_download_icon" class="icon-button" title="Download channels CSV" type="button">
                            <span class="fas fa-file-download"></span>
                        </button>
                    </div>
                </div>
                <form id="channels_arrow-upload-form">
                    <input id="channels-upload-from-arrow" class="hidden" type="file">
                    <input type="hidden" id="channels_upload-arrow-datasource" name="channels_upload-arrow-datasource">
                </form>
                <div class="selected-count">
                    <span id="num-selected-channels">0</span>
                    <span>of 4 selected</span>
                </div>
                <div id="channel_slot_list" class="channel-slot-list"></div>
                <button id="add_channel_button" class="sidebar-action secondary" type="button">
                    <span class="fas fa-plus"></span>
                    Add Channel
                </button>
            </section>

            <section class="sidebar-section compact">
                <div class="section-heading">
                    <h2>Display</h2>
                </div>
                <div class="toggle-row">
                    <label for="controls_scalebar">Scalebar</label>
                    <input id="controls_scalebar" type="checkbox" checked>
                </div>
                <button id="download_view_button" class="sidebar-action secondary" type="button">
                    <span class="fas fa-image"></span>
                    Download Image
                </button>
                <div id="gating_controls_panel">
                    <label>Outlines
                        <input id="gating_controls_outlines" type="checkbox" checked>
                    </label>
                    <label>Centroids
                        <input id="gating_controls_centroids" type="checkbox">
                    </label>
                </div>
            </section>
        </aside>

        <div id="openseadragon_wrapper">
            <button id="sidebar_expand_button" class="sidebar-expand-button" title="Show controls" type="button">
                <span class="fas fa-chevron-right"></span>
            </button>
            <div id="openseadragon">
                <div id="openseadragon_loader" class="viewer-loader">
                    <div class="lds-ellipsis">
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="legacy_controls_mount" aria-hidden="true">
            <div id="channel_list_wrapper">
                <div id="lowRow1" class="row">
                    <div id="boxHeading1" class="col-auto">
                        <span class="box-heading">Channels</span>
                    </div>
                    <div id="download-channels-header-div"></div>
                    <div class="col-auto" id="selected-channels-header-div"></div>
                </div>
                <div class="list" id="channel_list">
                    <div class="row">
                        <div class="col-auto">
                            <div class="lds-ellipsis" id="channel_list_loader"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="csv_channel_list_wrapper">
                <div id="lowRow3" class="row">
                    <div id="boxHeading3" class="col-auto">
                        <span class="box-heading">CSV Gating</span>
                    </div>
                    <div id="download-gating-header-div"></div>
                    <span id="lasso_selection_toggle_plus" class="far fa-plus-square lasso_selection_toggle" title="Toggle Selection"></span>
                    <span id="lasso_selection_toggle_minus" class="far fa-plus-square lasso_selection_toggle" style="display: none" title="Toggle Selection"></span>
                </div>

                <div class="list" id="csv_gating_list">
                    <div id="csv_gating_row" class="row">
                        <div class="col-auto">
                            <div class="lds-ellipsis" id="csv_gating_list_loader">
                                <div></div>
                                <div></div>
                                <div></div>
                                <div></div>
                            </div>
                        </div>
                    </div>
                    <div id="drag-and-drop-info">
                        <div class="d-flex justify-content-md-center align-items-center vh-100">
                            <span id="drag-and-drop-text">Drag and Drop A Gating CSV File</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../client/src/js/main.js" defer></script>
{% endif %}
{% endblock %}
