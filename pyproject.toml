[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minerva-analysis"
version = "1.0.2"
description = "OpenSeadragon-based cellular image viewing and analysis tool."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "appdirs",
    "Flask>=3.1",
    "Flask-SQLAlchemy>=3.1",
    "imagecodecs",
    "itsdangerous>=2.2",
    "Jinja2>=3.1",
    "matplotlib>=3.11",
    "numpy>=2.0",
    "ome-types>=0.6.3",
    "opencv-python>=4.12",
    "orjson>=3.11",
    "pandas>=3.0",
    "Pillow>=10.4",
    "pydantic>=2.13,<2.14",
    "requests",
    "scikit-image",
    "scikit-learn>=1.9",
    "scipy",
    "tifffile>=2026.7.31",
    "waitress",
    "Werkzeug>=3.1",
    "xmlschema",
    "zarr>=3",
]

[project.optional-dependencies]
jupyter = [
    "ipython",
    "jupyter-server-proxy",
]
dev = [
    "pyinstaller",
    "pytest",
]

[project.scripts]
minerva-analysis-server = "minerva_analysis.server_cli:main"

[project.entry-points.jupyter_serverproxy_servers]
minerva-analysis = "minerva_analysis.proxy:setup_minerva_analysis"

[tool.setuptools.packages.find]
include = ["minerva_analysis*"]

[tool.setuptools.package-data]
minerva_analysis = [
    "client/templates/*.html",
    "client/dist/*",
    "client/src/css/*.css",
    "client/src/img/*",
    "client/src/js/**/*.js",
    "client/src/shaders/*.glsl",
    "client/external/**/*",
]
